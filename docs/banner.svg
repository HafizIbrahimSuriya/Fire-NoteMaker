<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fire - notes, tasks, goals and reminders">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.55" stop-color="#ff6a13"/>
      <stop offset="1" stop-color="#e8420c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3cc"/>
    </linearGradient>
  </defs>
  <!-- rounded card, transparent outside the corners -->
  <rect width="1200" height="300" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="40" r="170" fill="#ffffff" opacity="0.07"/>
  <circle cx="1010" cy="290" r="120" fill="#ffffff" opacity="0.06"/>

  <!-- logo tile -->
  <rect x="70" y="70" width="160" height="160" rx="40" fill="#ffffff" opacity="0.18"/>
  <g transform="translate(95 92) scale(1.1)">
    <path d="M50 4 C56 24 82 34 82 60 C82 80 68 96 50 96 C32 96 18 80 18 60 C18 45 28 38 34 24 C40 32 42 37 47 39 C49 29 47 17 50 4 Z" fill="url(#flame)"/>
    <path d="M50 52 C54 62 64 66 64 76 C64 85 58 91 50 91 C42 91 36 85 36 76 C36 70 40 66 43 61 C46 64 48 64 49 62 C50 58 50 55 50 52 Z" fill="#ff6a13"/>
  </g>

  <!-- text -->
  <text x="270" y="152" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Fire</text>
  <text x="272" y="194" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="29" font-weight="500" fill="#ffffff" opacity="0.95">Notes, tasks, goals and reminders. 100% offline.</text>

  <!-- pills -->
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
    <rect x="272" y="214" width="96" height="36" rx="18" fill="#ffffff" opacity="0.22"/>
    <text x="320" y="238" text-anchor="middle">v1.0.0</text>
    <rect x="380" y="214" width="116" height="36" rx="18" fill="#ffffff" opacity="0.22"/>
    <text x="438" y="238" text-anchor="middle">Windows</text>
    <rect x="508" y="214" width="150" height="36" rx="18" fill="#ffffff" opacity="0.22"/>
    <text x="583" y="238" text-anchor="middle">Open source</text>
  </g>
</svg>
